// ============================================================================
// URT REDUX DEV PATCHES
// ============================================================================

// ----------------------------------------------------------------------------
// TRANSMITTER CONFIG
// Target: bpLargeTransmitterDish (Ensure you have the mod that adds this part, likely Bluedog)
// ----------------------------------------------------------------------------
@PART[bpLargeTransmitterDish]:FOR[UniversalResourceTransferRedux]
{
    MODULE
    {
        name = URT_Transmitter
        
        // -- CONFIGURABLE FIELDS --
        
        // Area in square meters. 
        // 25m^2 is roughly a 5.6m diameter dish.
        transmitterDiameter = 25.0
        
        // Wavelength. IMPORTANT: Kept small (0.001 = 1mm) relative to Area 
        // to prevent beam divergence math from resulting in > 360 degree spread.
        
	transmitterWavelength = 0.001
        
        transmitterEfficiency = 0.95
        
        inputResourceName = ElectricCharge
        inputResourceEnergyFactor = 1.0
        
        buildQuality = 1.0

        maxTransmittedPower = 1000

    
    }
}

// ----------------------------------------------------------------------------
// RECEIVER CONFIG
// Target: bpwr_rx_panel01E (Ensure you have this part)
// ----------------------------------------------------------------------------
@PART[bpwr_rx_panel01E]:FOR[UniversalResourceTransferRedux]
{
    MODULE
    {
        name = URT_Receiver
        
        // -- CONFIGURABLE FIELDS --
        
        // Area in square meters.
        receiverDiameter = 10.0
        
        // Must match transmitter wavelength for 100% efficiency
        receiverWavelength = 0.001
        
        receiverEfficiency = 0.85
        
        // Tuning factor. 
        // 0.1 allows for a bit of wavelength mismatch.
        // 0.0 would require perfect float precision match.
        receiverTuningFactor = 0.1
        
        outputResourceName = ElectricCharge
        outputResourceEnergyFactor = 1
    }
}
